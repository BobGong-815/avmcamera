plugins {
    id 'com.android.library'
}

android {
    namespace 'com.avm.framwork'
    compileSdkVersion rootProject.ext.android.compileSdkVersion
    ndkVersion '25.1.8937393'

    defaultConfig {
        minSdkVersion rootProject.ext.android.minSdkVersion
        targetSdkVersion rootProject.ext.android.targetSdkVersion
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildFeatures {
        viewBinding true
    }

}

dependencies {

    implementation 'androidx.appcompat:appcompat:1.0.0'
    implementation 'com.google.android.material:material:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation files('libs\\android_car.jar')
    implementation files('libs\\WeakHandler.jar')
    api files('libs\\SyncoreVehicleProperty.jar')
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
//    api files('libs\\SyncoreVehicleProperty-1.0.4-20240516.055722-1.jar')
//   api files('libs\\SyncoreVehicleProperty-1.0.13-20240715.013629-1.jar')
    //MVVM架构及基础功能或类模块
    //implementation project(':mvvmhabit')
}
